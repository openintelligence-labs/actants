name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,openai,anthropic,cache,cli,mcp,a2a]'
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      # Runs the docs-snippet suite (tests/test_docs_snippets.py), which compiles and
      # resolves every Python block in README.md and docs_site/ — both are committed, so
      # both are checked here — and the public-API typing suite
      # (tests/test_public_api_typing.py).
      - name: Test
        run: pytest tests/ -q
      - name: Type-check public API surface
        run: mypy --strict --no-incremental src/actants/__init__.py

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build wheel + sdist
        run: python -m build
      - name: Validate metadata
        run: twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
