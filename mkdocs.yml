      - LLM & providers: concepts/llm.md
      - Tools: concepts/tools.md
      - Streaming: concepts/streaming.md
      - ReAct loop: concepts/react.md
      - Embeddings: concepts/embeddings.md
      - Storage: concepts/storage.md
      - Observability: concepts/observability.md
  - MCP:
      - Client (consume): mcp/client.md
      - Server (expose): mcp/server.md
  - A2A:
      - Server (expose): a2a/server.md
      - Client (RemoteAgent): a2a/client.md
  - Cookbook:
      - Local research agent: cookbook/research-agent.md
      - Connect to MCP server: cookbook/mcp-tools.md
      - Two agents over A2A: cookbook/a2a-pair.md
