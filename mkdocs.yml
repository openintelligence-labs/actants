  - Migration:
      - From LangChain: migration/langchain.md
      - From CrewAI: migration/crewai.md
      - From Pydantic AI: migration/pydantic-ai.md
  - API reference:
      - Overview: api/index.md
      - Agent: api/agent.md
      - LLM: api/llm.md
      - Tools: api/tools.md
      - Errors: api/errors.md
      - Embeddings: api/embeddings.md
      - Storage: api/storage.md
      - Cache: api/cache.md
      - Cost & policies: api/cost-policies.md
      - Tracing: api/tracing.md
      - MCP: api/mcp.md
      - A2A: api/a2a.md
      - CLI helpers: api/cli.md
      - Config: api/config.md
      - Testing: api/testing.md
  - Reference:
