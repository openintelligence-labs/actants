[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actants"
version = "0.5.3"
description = "Local-first AI app framework: LLM gateway, agents, embeddings, storage, CLI helpers, observability. Build agents with one import. Ollama-default, async, typed."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Open Intelligence Labs contributors" }]
requires-python = ">=3.12"
keywords = [
    "llm",
    "ollama",
    "agent",
    "openai",
    "anthropic",
    "gemini",
    "groq",
    "mistral",
    "local-first",
    "streaming",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.30"]
gemini = []  # Uses httpx, already a core dep
groq = ["openai>=1.30"]  # Groq exposes an OpenAI-compatible API
mistral = ["openai>=1.30"]  # Mistral exposes an OpenAI-compatible API
cache = ["sqlite-vec>=0.1.0"]
cli = ["click>=8.1", "rich>=13.7"]
# mcp 2.0.0 removed mcp.server.fastmcp and mcp.shared.memory helpers; pin <2
# until actants.mcp is ported to the 2.x API.
mcp = ["mcp>=1.0,<2"]
a2a = ["a2a-sdk>=1.0", "starlette>=0.36", "uvicorn>=0.27"]
all = [
    "openai>=1.30",
    "anthropic>=0.30",
    "sqlite-vec>=0.1.0",
    "click>=8.1",
    "rich>=13.7",
    "mcp>=1.0,<2",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings>=0.25",
    "mkdocstrings-python>=1.10",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.16,<0.17",  # pin minor: ruff 0.16 began format-checking Markdown code blocks; unpinned CI broke on release day
    "build>=1.0",
    "twine>=5.0",
    "click>=8.1",
    "rich>=13.7",
    "mcp>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/openintelligence-labs/actants"
Repository = "https://github.com/openintelligence-labs/actants"
Issues = "https://github.com/openintelligence-labs/actants/issues"
Documentation = "https://actants.openintelligence-labs.org"
Changelog = "https://github.com/openintelligence-labs/actants/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
actants = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "A", "C4", "SIM"]
ignore = ["UP047"]  # PEP 695 type params — requires 3.12+, but noisy for generics with bounds
